<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест отображения заданий в единой ленте</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 5px;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #ff9800; }
        .message {
            background: #2a2a2a;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #4CAF50;
        }
        .message-separator {
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover { background: #45a049; }
        .log {
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .faction-content {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #444;
        }
        .quest-item {
            background: #333;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 3px solid #4CAF50;
        }
    </style>
</head>
<body>
    <h1>🔧 Тест отображения заданий в единой ленте</h1>
    
    <div class="test-section">
        <h2>📋 Проверка системы заданий</h2>
        <div id="quest-system-status">Проверяем...</div>
        <button onclick="checkQuestSystem()">Проверить систему заданий</button>
    </div>

    <div class="test-section">
        <h2>🎯 Тест отображения заданий</h2>
        <div id="quest-display-results"></div>
        <button onclick="testQuestDisplay()">Тестировать отображение заданий</button>
    </div>

    <div class="test-section">
        <h2>📊 Демонстрация единой ленты с заданиями</h2>
        <div id="unified-demo"></div>
        <button onclick="demoUnifiedFeed()">Показать демо единой ленты</button>
    </div>

    <div class="test-section">
        <h2>📝 Лог тестирования</h2>
        <div id="test-log" class="log"></div>
        <button onclick="clearLog()">Очистить лог</button>
    </div>

    <!-- Подключаем систему сообщений фракций -->
    <script src="src/core/faction-messages.js"></script>

    <script>
        let logElement = document.getElementById('test-log');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.textContent += `[${timestamp}] ${message}\n`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        function clearLog() {
            logElement.textContent = '';
        }

        // Инициализируем систему sourceQuests для тестирования
        function initializeTestSystem() {
            if (!window.sourceQuests) {
                window.sourceQuests = {
                    messageHistory: {},
                    activeQuests: {},
                    messageScheduler: {
                        activeFactions: new Set(['hq', 'rebels', 'mystery']),
                        lastMessageTime: {}
                    }
                };
            }
        }

        function checkQuestSystem() {
            log('=== ПРОВЕРКА СИСТЕМЫ ЗАДАНИЙ ===');
            
            const statusDiv = document.getElementById('quest-system-status');
            
            // Инициализируем систему
            initializeTestSystem();
            log('✅ Тестовая система инициализирована');

            // Проверяем наличие функций
            if (typeof window.getFactionUnifiedContent === 'function') {
                log('✅ getFactionUnifiedContent найдена');
            } else {
                log('❌ getFactionUnifiedContent не найдена');
                statusDiv.innerHTML = '<span class="error">❌ Функция getFactionUnifiedContent не найдена</span>';
                return;
            }

            if (typeof window.getActiveQuestContent === 'function') {
                log('✅ getActiveQuestContent найдена');
            } else {
                log('❌ getActiveQuestContent не найдена');
                statusDiv.innerHTML = '<span class="error">❌ Функция getActiveQuestContent не найдена</span>';
                return;
            }

            statusDiv.innerHTML = '<span class="success">✅ Система заданий готова к тестированию</span>';
            log('✅ Система заданий готова к тестированию');
        }

        function testQuestDisplay() {
            log('=== ТЕСТ ОТОБРАЖЕНИЯ ЗАДАНИЙ ===');
            
            const resultsDiv = document.getElementById('quest-display-results');
            resultsDiv.innerHTML = '';
            
            // Инициализируем систему
            initializeTestSystem();
            
            // Создаем тестовое задание для фракции hq
            const testQuest = {
                id: 'test_quest_hq_001',
                factionId: 'hq',
                title: 'Собрать ресурсы',
                description: 'Собрать 100 единиц дерева для строительства укреплений',
                reward: { type: 'resource', value: 'wood' },
                progress: 25,
                target: 100,
                grade: 'common',
                accepted: true,
                timestamp: new Date(Date.now() - 120000).toISOString(),
                acceptedAt: new Date(Date.now() - 120000).toISOString()
            };

            // Добавляем задание в активные
            window.sourceQuests.activeQuests.hq = testQuest;
            log('📝 Добавлено тестовое задание для hq');

            // Создаем тестовые сообщения
            const testMessages = [
                {
                    id: 'test_msg_hq_001',
                    type: 'faction_message',
                    timestamp: new Date(Date.now() - 60000).toISOString(),
                    data: {
                        message: {
                            id: 'hq_ann_001',
                            text: 'Внимание! Все граждане обязаны соблюдать комендантский час с 22:00 до 06:00.',
                            type: 'useful',
                            category: 'announcements'
                        }
                    }
                },
                {
                    id: 'test_msg_hq_002',
                    type: 'faction_message',
                    timestamp: new Date().toISOString(),
                    data: {
                        message: {
                            id: 'hq_ord_001',
                            text: 'Приказ № 47: Все граждане обязаны явиться на перекличку в 14:00.',
                            type: 'useful',
                            category: 'orders'
                        }
                    }
                }
            ];

            window.sourceQuests.messageHistory.hq = testMessages;
            log('📝 Добавлены тестовые сообщения для hq');

            // Тестируем отображение
            try {
                const unifiedContent = window.getFactionUnifiedContent('hq', 'radio');
                log('✅ getFactionUnifiedContent работает');
                
                resultsDiv.innerHTML = '<span class="success">✅ Отображение заданий работает корректно</span>';
                log('✅ Отображение заданий работает корректно');
                
                // Показываем результат
                const demoDiv = document.createElement('div');
                demoDiv.className = 'faction-content';
                demoDiv.innerHTML = unifiedContent;
                resultsDiv.appendChild(demoDiv);
                
            } catch (error) {
                resultsDiv.innerHTML = '<span class="error">❌ Ошибка при отображении заданий: ' + error.message + '</span>';
                log('❌ Ошибка при отображении заданий: ' + error.message);
            }
        }

        function demoUnifiedFeed() {
            log('=== ДЕМОНСТРАЦИЯ ЕДИНОЙ ЛЕНТЫ С ЗАДАНИЯМИ ===');
            
            const demoDiv = document.getElementById('unified-demo');
            demoDiv.innerHTML = '';
            
            // Инициализируем систему
            initializeTestSystem();
            
            // Создаем демо-данные для разных фракций
            const demos = [
                {
                    factionId: 'hq',
                    sourceType: 'radio',
                    messages: [
                        {
                            text: 'Внимание! Все граждане обязаны соблюдать комендантский час с 22:00 до 06:00.',
                            timestamp: new Date(Date.now() - 300000).toISOString()
                        },
                        {
                            text: 'Приказ № 47: Все граждане обязаны явиться на перекличку в 14:00.',
                            timestamp: new Date(Date.now() - 60000).toISOString()
                        }
                    ],
                    quest: {
                        id: 'demo_quest_hq_001',
                        title: 'Собрать ресурсы',
                        description: 'Собрать 100 единиц дерева для строительства укреплений',
                        reward: { type: 'resource', value: 'wood' },
                        progress: 45,
                        target: 100,
                        grade: 'common',
                        accepted: true,
                        timestamp: new Date(Date.now() - 180000).toISOString(),
                        acceptedAt: new Date(Date.now() - 180000).toISOString()
                    }
                },
                {
                    factionId: 'rebels',
                    sourceType: 'gps',
                    messages: [
                        {
                            text: 'Операция "Молот" начата! Мы атакуем конвой Штаба в квадрате 8-10.',
                            timestamp: new Date(Date.now() - 240000).toISOString()
                        },
                        {
                            text: 'Готовим засаду на патруль. Они идут по маршруту 5-9.',
                            timestamp: new Date(Date.now() - 30000).toISOString()
                        }
                    ],
                    quest: {
                        id: 'demo_quest_rebels_001',
                        title: 'Собрать оружие',
                        description: 'Найти и собрать 50 единиц боеприпасов',
                        reward: { type: 'resource', value: 'ammo' },
                        progress: 30,
                        target: 50,
                        grade: 'rare',
                        accepted: true,
                        timestamp: new Date(Date.now() - 150000).toISOString(),
                        acceptedAt: new Date(Date.now() - 150000).toISOString()
                    }
                }
            ];

            demos.forEach(demo => {
                // Настраиваем данные
                window.sourceQuests.messageHistory[demo.factionId] = demo.messages.map((msg, index) => ({
                    id: `demo_msg_${demo.factionId}_${index}`,
                    type: 'faction_message',
                    timestamp: msg.timestamp,
                    data: { message: { text: msg.text, type: 'useful', category: 'test' } }
                }));
                
                window.sourceQuests.activeQuests[demo.factionId] = {
                    ...demo.quest,
                    factionId: demo.factionId
                };

                // Создаем демо-блок
                const factionDiv = document.createElement('div');
                factionDiv.className = 'faction-content';
                factionDiv.innerHTML = `
                    <h3>📡 ${demo.factionId.toUpperCase()} (${demo.sourceType})</h3>
                    <div id="demo-${demo.factionId}">Загрузка...</div>
                `;
                demoDiv.appendChild(factionDiv);

                // Генерируем контент
                try {
                    const content = window.getFactionUnifiedContent(demo.factionId, demo.sourceType);
                    document.getElementById(`demo-${demo.factionId}`).innerHTML = content;
                    log(`✅ Демо для ${demo.factionId} создано`);
                } catch (error) {
                    document.getElementById(`demo-${demo.factionId}`).innerHTML = '<span class="error">Ошибка: ' + error.message + '</span>';
                    log(`❌ Ошибка для ${demo.factionId}: ${error.message}`);
                }
            });

            log('✅ Демонстрация единой ленты с заданиями создана');
        }

        // Автоматически запускаем проверку при загрузке
        window.addEventListener('load', function() {
            log('🚀 Тест отображения заданий в единой ленте запущен');
            checkQuestSystem();
        });
    </script>
</body>
</html>
