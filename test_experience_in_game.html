<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест системы опыта в игре</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        .test-section {
            background-color: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .test-button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        .test-button:hover {
            background-color: #45a049;
        }
        .log {
            background-color: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .status {
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест системы опыта в игре</h1>
    
    <div class="test-section">
        <h2>📊 Статус системы</h2>
        <div class="status">
            <div><strong>Система опыта:</strong> <span id="exp-status">Проверяется...</span></div>
            <div><strong>UI Overlay:</strong> <span id="ui-status">Проверяется...</span></div>
            <div><strong>Очки способностей:</strong> <span id="ability-status">Проверяется...</span></div>
        </div>
    </div>

    <div class="test-section">
        <h2>🎯 Тестирование функций</h2>
        <div>
            <button class="test-button" onclick="testExperienceSystem()">Тест системы опыта</button>
            <button class="test-button" onclick="testUIOverlay()">Тест UI Overlay</button>
            <button class="test-button" onclick="testAbilityPoints()">Тест очков способностей</button>
        </div>
    </div>

    <div class="test-section">
        <h2>📝 Лог тестирования</h2>
        <div class="log" id="test-log">
            <div>Система готова к тестированию...</div>
        </div>
        <button class="test-button" onclick="clearLog()">Очистить лог</button>
    </div>

    <script>
        // Функция логирования
        function log(message) {
            const logElement = document.getElementById('test-log');
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        // Очистка лога
        function clearLog() {
            document.getElementById('test-log').innerHTML = '<div>Лог очищен...</div>';
        }

        // Проверка системы опыта
        function testExperienceSystem() {
            log('🔍 Тестируем систему опыта...');
            
            // Проверяем доступность функций
            if (typeof window.updateGameUI === 'function') {
                log('✅ window.updateGameUI доступна');
            } else {
                log('❌ window.updateGameUI недоступна');
            }
            
            if (typeof window.showGameUI === 'function') {
                log('✅ window.showGameUI доступна');
            } else {
                log('❌ window.showGameUI недоступна');
            }
            
            // Проверяем, есть ли модальное окно способностей
            const abilitiesModal = document.getElementById('abilities-modal');
            if (abilitiesModal) {
                log('✅ Модальное окно способностей найдено');
                
                const abilityPoints = document.getElementById('ability-points');
                if (abilityPoints) {
                    log(`✅ Элемент очков способностей найден: ${abilityPoints.textContent}`);
                } else {
                    log('❌ Элемент очков способностей не найден');
                }
            } else {
                log('❌ Модальное окно способностей не найдено');
            }
            
            // Проверяем элементы опыта
            const levelElement = document.getElementById('level');
            const xpElement = document.getElementById('xp');
            const xpFillElement = document.getElementById('xp-fill');
            
            if (levelElement) log('✅ Элемент уровня найден');
            else log('❌ Элемент уровня не найден');
            
            if (xpElement) log('✅ Элемент опыта найден');
            else log('❌ Элемент опыта не найден');
            
            if (xpFillElement) log('✅ Элемент шкалы опыта найден');
            else log('❌ Элемент шкалы опыта не найден');
        }

        // Тест UI Overlay
        function testUIOverlay() {
            log('🔍 Тестируем UI Overlay...');
            
            if (typeof window.updateGameUI === 'function') {
                // Тестируем обновление данных
                const testData = {
                    bunkerLevel: 5,
                    bunkerExperience: 75,
                    maxExperience: 100,
                    abilityPoints: 12
                };
                
                log('📤 Отправляем тестовые данные в UI...');
                window.updateGameUI(testData);
                log('✅ Данные отправлены');
                
                // Проверяем результат
                setTimeout(() => {
                    const levelElement = document.getElementById('level');
                    const xpElement = document.getElementById('xp');
                    const abilityPointsElement = document.getElementById('ability-points');
                    
                    if (levelElement) {
                        log(`📊 Уровень отображается: ${levelElement.textContent}`);
                    }
                    if (xpElement) {
                        log(`📊 Опыт отображается: ${xpElement.textContent}`);
                    }
                    if (abilityPointsElement) {
                        log(`📊 Очки способностей отображаются: ${abilityPointsElement.textContent}`);
                    }
                }, 100);
            } else {
                log('❌ UI Overlay недоступен');
            }
        }

        // Тест очков способностей
        function testAbilityPoints() {
            log('🔍 Тестируем очки способностей...');
            
            const abilityPointsElement = document.getElementById('ability-points');
            if (abilityPointsElement) {
                const currentValue = abilityPointsElement.textContent;
                log(`📊 Текущие очки способностей: ${currentValue}`);
                
                // Проверяем, что это число
                if (!isNaN(parseInt(currentValue))) {
                    log('✅ Очки способностей отображаются как число');
                } else {
                    log('❌ Очки способностей не отображаются как число');
                }
            } else {
                log('❌ Элемент очков способностей не найден');
            }
            
            // Проверяем модальное окно
            const abilitiesModal = document.getElementById('abilities-modal');
            if (abilitiesModal) {
                log('✅ Модальное окно способностей доступно');
                
                // Проверяем, можно ли его открыть
                if (typeof openModal === 'function') {
                    log('✅ Функция openModal доступна');
                } else {
                    log('❌ Функция openModal недоступна');
                }
            } else {
                log('❌ Модальное окно способностей недоступно');
            }
        }

        // Автоматическая проверка при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Начинаем автоматическую проверку...');
            
            // Проверяем основные элементы
            setTimeout(() => {
                testExperienceSystem();
                
                setTimeout(() => {
                    testUIOverlay();
                    
                    setTimeout(() => {
                        testAbilityPoints();
                        log('🎯 Автоматическая проверка завершена');
                    }, 500);
                }, 500);
            }, 1000);
        });
    </script>
</body>
</html>
